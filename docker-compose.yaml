services:
  pvledger:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PVLEDGER_CONTAINER_BIND: "0.0.0.0"
    volumes:
      - pvledger-data:/var/lib/pvledger
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pvledger-data:
