        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /plugins:
    get:
      summary: List registered plugins
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Array' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /plugins/{id}/enable:
    parameters:
      - $ref: '#/components/parameters/id'
    post:
      summary: Enable an available plugin
      parameters:
        - $ref: '#/components/parameters/csrf'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Array' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /plugins/{id}/disable:
    parameters:
      - $ref: '#/components/parameters/id'
    post:
      summary: Disable a plugin
      parameters:
        - $ref: '#/components/parameters/csrf'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Array' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /lookups/{resource}:
    get:
      summary: Authorized labels and primary keys, up to 100 per page
      parameters:
        - {name: resource, in: path, required: true, schema: {type: string, enum: [banks, countries, currencies, expense-categories, users, roles]}}
        - $ref: '#/components/parameters/page'
      responses:
        '200': &lookupResponse
          description: Authorized lookup options in label and ID order
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: {type: integer}
                    label: {type: string}
  /lookups/accounts/{kind}:
    get:
      summary: Authorized account options
      parameters:
        - {name: kind, in: path, required: true, schema: {type: string, enum: [current, savings, credit]}}
        - $ref: '#/components/parameters/page'
      responses:
        '200': *lookupResponse
  /import/preview:
    post:
      summary: Review mapped expense rows from a local CSV, QIF, OFX or QFX file
      parameters:
        - $ref: '#/components/parameters/csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dataset, id_account, id_category, id_currency, rows]
              properties:
                dataset: {type: string, enum: [expenses]}
                id_account: {type: integer}
                id_category: {type: integer}
                id_currency: {type: integer}
                rows:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: object
                    properties:
                      name: {type: string}
                      date: {type: integer, format: int64}
                      amount: {type: number}
                      description: {type: string}
                      currency: {type: string, description: Source ISO code when supplied}
                      source_id: {type: string}
                      error: {type: string, description: File parser error for an ineligible row}
      responses:
        '200': {description: Mapped rows with error and duplicate flags and a session-bound ten-minute review token}
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /import/commit:
    post:
      summary: Insert the explicitly selected rows of a reviewed import atomically
      parameters:
        - $ref: '#/components/parameters/csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, confirm, rows]
              properties:
                token: {type: string}
                confirm: {type: boolean, enum: [true]}
                rows: {type: array, minItems: 1, uniqueItems: true, items: {type: integer, minimum: 0}}
      responses:
        '200': {description: Imported, skipped and failed counts}
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /export/preview:
    post:
      summary: List available columns, authorized count and first ten matching rows
      parameters:
        - $ref: '#/components/parameters/csrf'
      requestBody: &exportRequest
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dataset]
              properties:
                dataset: {type: string, enum: [accounts/current, accounts/savings, accounts/credit, history/current, history/savings, expenses, planned-expenses, recurring-expenses, expense-categories, income, planned-income, debts, taxes, banks, countries, currencies]}
                format: {type: string, enum: [csv]}
                columns: {type: array, items: {type: string}, uniqueItems: true, minItems: 1}
                filters:
                  type: object
                  properties:
                    id_account: {type: integer}
                    id_currency: {type: integer}
                    status: {type: integer}
                    from: {type: integer, format: int64}
                    to: {type: integer, format: int64}
      responses:
        '200': {description: Available columns, total, download row limit and sample items}
        '422': { $ref: '#/components/responses/Error' }
  /export/download:
    post:
      summary: Download the authorized selection as UTF-8 CSV
      parameters:
        - $ref: '#/components/parameters/csrf'
      requestBody: *exportRequest
      responses:
        '200':
          description: A spreadsheet-safe CSV attachment
          content:
            text/csv: {schema: {type: string, format: binary}}
        '422': { $ref: '#/components/responses/Error' }
  /reports/expense-categories:
    get:
      summary: Actual expense totals by currency ID and category ID
      parameters:
        - $ref: '#/components/parameters/account'
        - &currencyFilter {name: id_currency, in: query, schema: {type: integer, minimum: 1}}
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
      responses:
        '200': {description: Items with currency, category and amount}
        '422': { $ref: '#/components/responses/Error' }
  /reports/balances:
    get:
      summary: Stored balance snapshots ordered by currency, account, timestamp and snapshot ID
      parameters:
        - {name: account_type, in: query, schema: {type: string, enum: [current, savings], default: current}}
        - $ref: '#/components/parameters/account'
        - *currencyFilter
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
      responses:
        '200': {description: Items with currency, account, snapshot ID, date and amount}
        '422': { $ref: '#/components/responses/Error' }
  /ui/menu:
    get:
      summary: List menu entries available to the session
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Array' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /i18n/{locale}:
    parameters:
      - $ref: '#/components/parameters/locale'
    get:
      summary: Read translations including English fallback
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Object' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /system/health:
    get:
      summary: Read startup state
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Object' }
  /system/version:
    get:
      summary: Read PVLedger version
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Object' }
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: pvl_session
  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    locale:
      name: locale
      in: path
      required: true
      schema: { type: string, example: en_US }
    csrf:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
    loginHeader:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string, enum: [login] }
    page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    size:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    sort:
      name: sort
      in: query
      schema: { type: string, example: "-date" }
    account:
      name: id_account
      in: query
      schema: { type: integer, format: int64, minimum: 1 }
    from:
      name: from
      in: query
      description: Inclusive lower bound in UTC epoch seconds.
      schema: { type: integer, format: int64 }
    to:
      name: to
      in: query
      description: Inclusive upper bound in UTC epoch seconds.
      schema: { type: integer, format: int64 }
    status:
      name: status
      in: query
      description: Stored status code.
      schema: { type: integer, format: int64 }
  responses:
    Error:
      description: Request failed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Object:
      type: object
      additionalProperties: true
    Array:
      type: array
      items: { $ref: '#/components/schemas/Object' }
    Credentials:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
    Session:
      type: object
      required: [csrf]
      properties:
        csrf: { type: string }
    Page:
      type: object
      required: [items, page, page_size, total]
      properties:
        items: { $ref: '#/components/schemas/Array' }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
    Collection:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [fields, writable]
          properties:
            fields: { $ref: '#/components/schemas/Array' }
            writable: { type: boolean }
    History:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [currency]
          properties:
            currency: { $ref: '#/components/schemas/Object' }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
