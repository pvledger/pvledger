components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: pvl_session
  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    locale:
      name: locale
      in: path
      required: true
      schema: { type: string, example: en_US }
    csrf:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
    loginHeader:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string, enum: [login] }
    page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    size:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    sort:
      name: sort
      in: query
      schema: { type: string, example: "-date" }
    account:
      name: id_account
      in: query
      schema: { type: integer, format: int64, minimum: 1 }
    from:
      name: from
      in: query
      description: Inclusive lower bound in UTC epoch seconds.
      schema: { type: integer, format: int64 }
    to:
      name: to
      in: query
      description: Inclusive upper bound in UTC epoch seconds.
      schema: { type: integer, format: int64 }
    status:
      name: status
      in: query
      description: Stored status code.
      schema: { type: integer, format: int64 }
  responses:
    Error:
      description: Request failed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Object:
      type: object
      additionalProperties: true
    Array:
      type: array
      items: { $ref: '#/components/schemas/Object' }
    Credentials:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
    Session:
      type: object
      required: [csrf]
      properties:
        csrf: { type: string }
    Page:
      type: object
      required: [items, page, page_size, total]
      properties:
        items: { $ref: '#/components/schemas/Array' }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
    Collection:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [fields, writable]
          properties:
            fields: { $ref: '#/components/schemas/Array' }
            writable: { type: boolean }
    History:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [currency]
          properties:
            currency: { $ref: '#/components/schemas/Object' }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
