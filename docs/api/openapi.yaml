              schema: { $ref: '#/components/schemas/History' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /auth/login:
    post:
      summary: Start session
      security: []
      parameters:
        - $ref: '#/components/parameters/loginHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/me:
    get:
      summary: Read signed-in user, CSRF token and instance default currency ID
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Object' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      summary: End session
      parameters:
        - $ref: '#/components/parameters/csrf'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Object' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /dashboard:
    get:
      summary: Read currency-grouped balances and latest expenses
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Object' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /settings:
    get:
      summary: Read instance preferences
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Object' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    patch:
      summary: Update instance preferences
      parameters:
        - $ref: '#/components/parameters/csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Object' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Object' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /settings/backup:
    get:
      summary: Download a consistent SQLite snapshot of the entire instance (administrator)
      responses:
        '200':
          description: PVLedger SQLite database attachment
          content:
            application/vnd.sqlite3: {schema: {type: string, format: binary}}
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '413': {description: Snapshot exceeds 64 MiB}
  /settings/restore:
    post:
      summary: Replace the ledger with an uploaded backup (administrator)
      parameters:
        - $ref: '#/components/parameters/csrf'
      requestBody: &backupFile
        required: true
        description: Complete PVLedger SQLite database file up to 64 MiB, sent with a fixed Content-Length
        content:
          application/octet-stream: {schema: {type: string, format: binary}}
          application/vnd.sqlite3: {schema: {type: string, format: binary}}
      responses:
        '204': {description: Database restored and all sessions expired}
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '413': {description: File exceeds 64 MiB}
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /setup/restore:
    post:
      summary: Initialize an unclaimed instance using a backup
      security: []
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          description: The first-run token from the local setup form
          schema: {type: string}
      requestBody: *backupFile
      responses:
        '204': {description: Setup complete. Sign in with credentials from the backup.}
        '403': { $ref: '#/components/responses/Error' }
        '404': {description: Setup is closed}
        '413': {description: File exceeds 64 MiB}
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /plugins:
    get:
      summary: List registered plugins
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Array' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /plugins/{id}/enable:
    parameters:
      - $ref: '#/components/parameters/id'
    post:
      summary: Enable an available plugin
      parameters:
        - $ref: '#/components/parameters/csrf'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Array' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /plugins/{id}/disable:
    parameters:
      - $ref: '#/components/parameters/id'
    post:
      summary: Disable a plugin
      parameters:
        - $ref: '#/components/parameters/csrf'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Array' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /lookups/{resource}:
    get:
      summary: Authorized labels and primary keys, up to 100 per page
      parameters:
        - {name: resource, in: path, required: true, schema: {type: string, enum: [banks, countries, currencies, expense-categories, users, roles]}}
        - $ref: '#/components/parameters/page'
      responses:
        '200': &lookupResponse
          description: Authorized lookup options in label and ID order
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: {type: integer}
                    label: {type: string}
  /lookups/accounts/{kind}:
    get:
      summary: Authorized account options
      parameters:
        - {name: kind, in: path, required: true, schema: {type: string, enum: [current, savings, credit]}}
        - $ref: '#/components/parameters/page'
      responses:
        '200': *lookupResponse
  /import/preview:
    post:
      summary: Review mapped expense rows from a local CSV, QIF, OFX or QFX file
      parameters:
        - $ref: '#/components/parameters/csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dataset, id_account, id_category, id_currency, rows]
              properties:
                dataset: {type: string, enum: [expenses]}
                id_account: {type: integer}
                id_category: {type: integer}
                id_currency: {type: integer}
                rows:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: object
                    properties:
                      name: {type: string}
                      date: {type: integer, format: int64}
                      amount: {type: number}
                      description: {type: string}
                      currency: {type: string, description: Source ISO code when supplied}
                      source_id: {type: string}
                      error: {type: string, description: File parser error for an ineligible row}
      responses:
        '200': {description: Mapped rows with error and duplicate flags and a session-bound ten-minute review token}
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /import/commit:
    post:
      summary: Insert the explicitly selected rows of a reviewed import atomically
      description: Each selected expense debits its account. The batch, balance changes and resulting history entries commit together.
      parameters:
        - $ref: '#/components/parameters/csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, confirm, rows]
              properties:
                token: {type: string}
                confirm: {type: boolean, enum: [true]}
                rows: {type: array, minItems: 1, uniqueItems: true, items: {type: integer, minimum: 0}}
      responses:
        '200': {description: Imported, skipped and failed counts}
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /export/preview:
    post:
      summary: List available columns, authorized count and first ten matching rows
      parameters:
        - $ref: '#/components/parameters/csrf'
      requestBody: &exportRequest
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dataset]
              properties:
                dataset: {type: string, enum: [accounts/current, accounts/savings, accounts/credit, history/current, history/savings, expenses, planned-expenses, recurring-expenses, expense-categories, income, planned-income, debts, taxes, banks, countries, currencies]}
                format: {type: string, enum: [csv, ods, xlsx, qif, ofx, qfx], default: csv}
                columns: {type: array, items: {type: string}, uniqueItems: true, minItems: 1}
                filters:
                  type: object
                  properties:
                    id_account: {type: integer}
                    id_currency: {type: integer}
                    status: {type: integer}
                    from: {type: integer, format: int64}
                    to: {type: integer, format: int64}
      responses:
        '200': {description: Available columns, total, download row limit and sample items}
        '422': { $ref: '#/components/responses/Error' }
  /export/download:
    post:
      summary: Download the authorized selection
      description: CSV, ODS and XLSX support all listed datasets and column selection. QIF, OFX and QFX accept only actual expenses or income from one account and currency, with fixed columns.
      parameters:
        - $ref: '#/components/parameters/csrf'
      requestBody: *exportRequest
      responses:
        '200':
          description: A named attachment of the requested format
          content:
            text/csv: {schema: {type: string, format: binary}}
            application/vnd.oasis.opendocument.spreadsheet: {schema: {type: string, format: binary}}
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: {schema: {type: string, format: binary}}
            application/qif: {schema: {type: string, format: binary}}
            application/x-ofx: {schema: {type: string, format: binary}}
            application/vnd.intu.qfx: {schema: {type: string, format: binary}}
        '422': { $ref: '#/components/responses/Error' }
  /reports/expense-categories:
    get:
      summary: Actual expense totals by currency ID and category ID
      parameters:
        - $ref: '#/components/parameters/account'
        - &currencyFilter {name: id_currency, in: query, schema: {type: integer, minimum: 1}}
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
      responses:
        '200': {description: Items with currency, category and amount}
        '422': { $ref: '#/components/responses/Error' }
  /reports/spending:
    get:
      summary: Daily actual spending by expense currency
      description: Filters apply to individual authorized expenses before aggregation. Each day is UTC midnight in Unix seconds. Days without a dated amount are omitted.
      parameters:
        - $ref: '#/components/parameters/account'
        - *currencyFilter
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
      responses:
        '200':
          description: Daily totals ordered by currency ID and day (up to 5,000 items)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id_currency, currency, day, amount]
                      properties:
                        id_currency: {type: integer}
                        currency: {type: string}
                        day: {type: integer, format: int64}
                        amount: {type: number}
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /reports/estimates:
    get:
      summary: Daily income, expenses and net cash flow by currency
      description: Uses actual entries through today UTC and outstanding plans from tomorrow. Omit id_account for all authorized current accounts.
      parameters:
        - $ref: '#/components/parameters/account'
        - *currencyFilter
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
      responses:
        '200':
          description: Up to 5,000 daily totals ordered by currency ID and UTC day
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [day, id_currency, currency, basis, income, expenses, net]
                      properties:
                        day: {type: integer, format: int64}
                        id_currency: {type: integer}
                        currency: {type: string}
                        basis: {type: string, enum: [actual, planned]}
                        income: {type: number}
                        expenses: {type: number}
                        net: {type: number}
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /reports/balances:
    get:
      summary: Stored balance snapshots ordered by currency, account, timestamp and snapshot ID
      parameters:
        - {name: account_type, in: query, schema: {type: string, enum: [current, savings], default: current}}
        - $ref: '#/components/parameters/account'
        - *currencyFilter
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
      responses:
        '200': {description: Items with currency, account, snapshot ID, date and amount}
        '422': { $ref: '#/components/responses/Error' }
  /ui/menu:
    get:
      summary: List menu entries available to the session
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Array' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /i18n/{locale}:
    parameters:
      - $ref: '#/components/parameters/locale'
    get:
      summary: Read translations including English fallback
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Object' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /system/health:
    get:
      summary: Read startup state
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Object' }
  /system/version:
    get:
      summary: Read PVLedger version
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Object' }
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: pvl_session
  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    locale:
      name: locale
      in: path
      required: true
      schema: { type: string, example: en_US }
    csrf:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
    loginHeader:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string, enum: [login] }
    page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    size:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    sort:
      name: sort
      in: query
      schema: { type: string, example: "-date" }
    account:
      name: id_account
      in: query
      schema: { type: integer, format: int64, minimum: 1 }
    from:
      name: from
      in: query
      description: Inclusive lower bound in UTC epoch seconds.
      schema: { type: integer, format: int64 }
    to:
      name: to
      in: query
      description: Inclusive upper bound in UTC epoch seconds.
      schema: { type: integer, format: int64 }
    status:
      name: status
      in: query
      description: Stored status code.
      schema: { type: integer, format: int64 }
  responses:
    Error:
      description: Request failed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Object:
      type: object
      additionalProperties: true
    Array:
      type: array
      items: { $ref: '#/components/schemas/Object' }
    IncomeFields:
      type: object
      additionalProperties: false
      properties:
        id_account: {type: integer, minimum: 1}
        name: {type: string}
        amount: {type: number}
        date: {type: integer, format: int64, description: UTC epoch seconds}
        status:
          type: integer
          enum: [0, 1, 2, 3]
          description: 0 Planned, 1 Processed, 2 Processed with changes, 3 Declined
        description: {type: string, nullable: true}
    Credentials:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
    Session:
      type: object
      required: [csrf]
      properties:
        csrf: { type: string }
    Page:
      type: object
      required: [items, page, page_size, total]
      properties:
        items: { $ref: '#/components/schemas/Array' }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
    Collection:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [fields, writable]
          properties:
            fields: { $ref: '#/components/schemas/Array' }
            writable: { type: boolean }
    History:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [currency]
          properties:
            currency: { $ref: '#/components/schemas/Object' }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
